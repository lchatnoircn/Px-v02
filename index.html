/* ---------- Sphère nid-d'abeilles (polyèdre de Goldberg) ---------- */
function build(d){
 const t=(1+Math.sqrt(5))/2,nm=p=>{const l=Math.hypot(...p);return p.map(x=>x/l)};
 let v=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(nm);
 let f=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
 for(let s=0;s<d;s++){const m={},nf=[];
  const mid=(a,b)=>{const k=a<b?a+'_'+b:b+'_'+a;if(m[k]==null){v.push(nm(v[a].map((x,i)=>x+v[b][i])));m[k]=v.length-1}return m[k]};
  f.forEach(([a,b,c])=>{const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);nf.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca])});f=nf}
 const ce=f.map(([a,b,c])=>nm([0,1,2].map(i=>v[a][i]+v[b][i]+v[c][i]))),E={};
 f.forEach((fc,i)=>{for(let j=0;j<3;j++){const a=fc[j],b=fc[(j+1)%3],k=a<b?a+'_'+b:b+'_'+a;(E[k]=E[k]||[]).push(i)}});
 return Object.values(E).filter(e=>e.length==2).map(([i,j])=>[...ce[i],...ce[j]]);
}
const cv=$('#orb'),cx=cv.getContext('2d');let W=0,H=0,dpr=1,lvl=.05,ay0=0,lt=0;
function rs(){const r=cv.parentElement.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr}
new ResizeObserver(rs).observe(cv.parentElement);
function fr(ms){

 const tg=st=='listen'?.5+.25*Math.sin(t*5):st=='speak'?.3+.45*Math.abs(Math.sin(t*9)*Math.sin(t*3.3)):st=='think'?.25+.1*Math.sin(t*8):.04+.03*Math.sin(t*1.5);
 lvl+=(tg-lvl)*.12;
 ay0+=dt*(.22+lvl*.9)*S.speed;
 cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
 const R=Math.min(W,H)*.4*(1+lvl*.1),ca=Math.cos(ay0),sa=Math.sin(ay0),ax=.42,cX=Math.cos(ax),sX=Math.sin(ax),mx=W/2,my=H/2,w=lvl*.06;
 const P=(x,y,z)=>{const k=1+w*Math.sin(x*4+z*3+t*6);let X=(x*ca+z*sa)*k,Z=(-x*sa+z*ca)*k,Y=y*k;const Y2=Y*cX-Z*sX,Z2=Y*sX+Z*cX,f=3/(3-Z2);return[mx+X*R*f,my+Y2*R*f,Z2]};
 const fp=new Path2D(),bp=new Path2D();
 for(const s of segs){const a=P(s[0],s[1],s[2]),b=P(s[3],s[4],s[5]);const p=(a[2]+b[2])>0?fp:bp;p.moveTo(a[0],a[1]);p.lineTo(b[0],b[1])}
 cx.strokeStyle=S.ac;cx.lineJoin=cx.lineCap='round';
 cx.globalAlpha=.28;cx.lineWidth=.5*S.lw;cx.stroke(bp);
 cx.shadowColor=S.ac;cx.shadowBlur=3+lvl*14;cx.globalAlpha=.9;cx.lineWidth=.8*S.lw;cx.stroke(fp);
 cx.globalAlpha=.55;cx.lineWidth=.7*S.lw;cx.beginPath();cx.arc(mx,my,R*(1.0),0,7);cx.stroke();
 cx.shadowBlur=0;cx.globalAlpha=1;
}

/* ---------- Savoir : base locale IndexedDB ---------- */
const db=new Promise((res,rej)=>{try{const r=indexedDB.open('px_kb',1);r.onupgradeneeded=()=>r.result.createObjectStore('a',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej()}});
const all=async()=>{try{const d=await db;return await new Promise(r=>{const q=d.transaction('a').objectStore('a').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])})}catch{return[]}};
const put=async a=>{try{const d=await db;return await new Promise(r=>{const t=d.transaction('a','readwrite'),s=t.objectStore('a');a.forEach(x=>s.put(x));t.oncomplete=t.onerror=()=>r()})}catch{}};
const wipeKb=async()=>{try{const d=await db;return await new Promise(r=>{const t=d.transaction('a','readwrite');t.objectStore('a').clear();t.oncomplete=()=>r()})}catch{}};

const SEED=DOCS.flatMap(f=>f.a.map(([title,text])=>({id:'s:'+f.t+title,l:'fr',title,k:nz(title),text,seed:1})));

async function search(t,n=1){
 const k=nz(t),w=k.split(' ').filter(x=>x.length>1);if(!k)return[];
 const rows=SEED.concat(await all()),sc=[];
 for(const r of rows){let s=0;if(r.k==k)s=100;else if(r.k.includes(k))s=60-Math.min(r.k.length-k.length,30);else if(w.length&&w.every(x=>r.k.includes(x)))s=40;if(s)sc.push([s,r])}
 if(!sc.length){const lt=t.toLowerCase();rows.forEach(r=>{if(r.text.toLowerCase().includes(lt))sc.push([10,r])})}
 return sc.sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1]);
}

['Géographie',['pays','capitale','fleuve','montagne','océan','île']],
['Corps et santé',['anatomie','maladie','médicament','nutrition','cerveau','cœur']],
['Technologie',['informatique','Internet','électronique','Linux','robotique','énergie']],

['Nature',['animal','plante','oiseau','mammifère','climat','écologie']]];
async function wsearch(l,term,off){
 const u=`https://${l}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch=${encodeURIComponent(term)}&gsrnamespace=0&gsrlimit=20&gsroffset=${off}&prop=extracts&exintro=1&explaintext=1&exlimit=max`;
 const j=await (await fetch(u)).json();
 return Object.values(j.query?.pages||{}).filter(p=>p.extract&&p.extract.length>40).map(p=>({id:l+':'+p.title,l,title:p.title,k:nz(p.title),text:p.extract.slice(0,1500)}));
}
let dl=null;
async function download(jobs,l,pages){
 if(dl){dl.stop=true;return}
 dl={stop:false};let n=0,tot=jobs.length*pages,i=0;rk(true);
 try{
  for(const term of jobs){for(let p=0;p<pages;p++){
   if(dl.stop)throw 'stop';
   const rows=await wsearch(l,term,p*20);if(!rows.length)break;
   await put(rows);n+=rows.length;i++;
   $('#dlp').style.width=(100*i/tot)+'%';$('#dls').textContent=`${n} articles téléchargés — « ${term} »`;
  }i+=pages-Math.min(pages,1)*0}
  toast('Téléchargement terminé : '+n+' articles');
 }catch(e){toast(e==='stop'?'Téléchargement arrêté':'Réseau indisponible ou bloqué par l’hébergeur de la page')}
 dl=null;rk();
}

const sents=t=>t.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).slice(0,3).join(' ').slice(0,420);
async function answer(q){
 const n=nz(q);
 for(const c of C){if(c.t&&n.includes(nz(c.t))){if(c.k=='url'){setTimeout(()=>window.open(c.r,'_blank'),700);return 'J’ouvre '+c.t+'.'}return c.r}}
 if(/qui es tu|tu es qui|comment tu t appelles/.test(n))return `Je suis ${S.name}, un assistant vocal qui fonctionne sans connexion.${S.user?' Ravi de te retrouver, '+S.user+'.':''}`;
 if(/\bheure\b/.test(n)){const d=new Date();return `Il est ${d.getHours()} heures ${String(d.getMinutes()).padStart(2,'0')}.`}
 if(/quel jour|quelle date|date d aujourd/.test(n))return 'Nous sommes le '+new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';
 if(/^(bonjour|salut|coucou|hello)/.test(n))return 'Bonjour'+(S.user?' '+S.user:'')+' ! Que puis-je faire pour toi ?';
 let tp=n.replace(/^(parle moi (du|de la|de l|des|de|d)?|qui est|qui etait|c est quoi|qu est ce que|qu est ce qu|que sais tu (sur|de)|dis moi ce que tu sais sur|cherche|definition de)\s*/,'').replace(/^(le|la|les|l|un|une|du|de|des|d)\s+/,'').trim();
 const r=(await search(tp,1))[0];
 if(r)return sents(r.text);
 if(navigator.onLine&&S.wifi){try{const j=await (await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(tp)}`)).json();if(j.extract)return sents(j.extract)}catch{}}
 return `Je n’ai rien sur « ${tp} » pour l’instant. Télécharge des packs dans l’onglet ${S.tabs[2]}.`;
}
function showCap(q,a){$('#cap').innerHTML=q?`${esc(q)}<b>${esc(a)}</b>`:hint()}

function speak(a){
 if(!S.talk||!window.speechSynthesis){st='idle';return}
 speechSynthesis.cancel();const p=VP.find(v=>v[0]==S.vp)||VP[0],u=new SpeechSynthesisUtterance(a),vs=speechSynthesis.getVoices();
 u.lang=S.lang;u.pitch=p[3];u.rate=S.rate*p[4];
 const v=p[2].map(n=>vs.find(x=>x.name.startsWith(n))).find(Boolean)||vs.find(x=>x.lang.startsWith(S.lang.slice(0,2)));
 if(v)u.voice=v;u.onend=u.onerror=()=>{st='idle'};st='speak';speechSynthesis.speak(u)}
let rec;
function listen(){
 if(st=='listen'){rec&&rec.stop();return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast('Micro indisponible ici : utilise le clavier');return}
 window.speechSynthesis&&speechSynthesis.cancel();
 rec=new SR();rec.lang=S.lang;rec.interimResults=true;let fin='';
 rec.onresult=e=>{fin=[...e.results].map(r=>r[0].transcript).join('');$('#cap').textContent=fin};
 rec.onend=()=>{st='idle';if(fin.trim())ask(fin);else showCap('','')};
 rec.onerror=e=>{st='idle';toast('Micro : '+(e.error=='not-allowed'?'accès refusé':e.error))};
 st='listen';$('#cap').textContent='J’écoute…';try{rec.start()}catch{st='idle'}
}
